# sheets — self-hosted deployment.
# Copy .env.example to .env and fill in the values before `docker compose up -d`.
services:
  sheets:
    build: .
    image: ghcr.io/voidsuite/sheets:latest
    container_name: sheets
    restart: unless-stopped
    ports:
      - "${PORT:-3007}:3007"
    env_file:
      - .env
    volumes:
      # SQLite database persists across container recreates.
      - sheets-data:/app/server/data

volumes:
  sheets-data: